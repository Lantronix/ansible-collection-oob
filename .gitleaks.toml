# gitleaks configuration: default ruleset plus a rule for Ansible inventory credential literals.
[extend]
useDefault = true

[[rules]]
id = "ansible-inventory-credential"
description = "Ansible inventory or vars credential literal (ansible_password, ansible_ssh_pass, ansible_become_pass)"
regex = '''(?i)ansible_(?:ssh_pass|become_pass|password|become_password)\s*[:=]\s*["']?([^"'\s{][^"'\s]{3,})'''
secretGroup = 1
[rules.allowlist]
regexes = [
  '''\{\{''',
  '''(?i)(CHANGE_ME|YOUR_|example|placeholder|vault_|lookup\()''',
]

[allowlist]
description = "Documentation placeholders used in module examples and playbooks"
regexes = [
  '''(?i)a1b2c3d4e5f6|b2c3d4e5f6a1|c3d4e5f6a1b2''',
]
