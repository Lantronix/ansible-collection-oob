requires_ansible: ">=2.16.0"
plugin_routing:
  modules:
    percepxion_aoob_session:
      deprecation:
        removal_version: "2.0.0"
        warning_text: >-
          percepxion_aoob_session is deprecated. The connect and disconnect
          endpoints it calls require device-token authentication and are not
          reachable with user credentials. Use the Percepxion web interface to
          initiate AOOB sessions.
