requires_ansible: ">=2.16.0"
plugin_routing:
  modules:
    percepxion_aoob_session:
      deprecation:
        removal_version: "2.0.0"
        warning_text: >-
          percepxion_aoob_session is deprecated. The endpoints it calls
          (/v3/device/connect, /v3/device/disconnect) exist server-side but are
          device-token authenticated: they require the device auth_token header,
          not a user session token, so they return 401 with user credentials
          (verified live 2026-08-27). Use the Percepxion web interface to
          initiate AOOB sessions.
