---
# lockdown.yml, Bulk suspend or restore Percepxion user access
#
# What this does:
#   Suspends (or restores) a list of Percepxion user accounts. Use it for
#   offboarding, an incident-response lockdown, or restoring access afterward.
#   Suspend/resume is idempotent: users already in the target state are skipped.
#
# Backed by PUT /v1/user (verified live against Percepxion 6.13, 2026-08-27).
#
# Run (suspend a list of users):
#   ansible-playbook -i inventory.yml playbooks/percepxion/lockdown.yml \
#     -e '{"action":"suspend","usernames":["contractor1","contractor2"]}'
#
# Run (restore access):
#   ansible-playbook -i inventory.yml playbooks/percepxion/lockdown.yml \
#     -e '{"action":"restore","usernames":["contractor1","contractor2"]}'

- name: Percepxion user access lockdown
  hosts: percepxion_platform
  gather_facts: false

  vars:
    # "suspend" to disable access, "restore" to re-enable.
    lockdown_action: "suspend"

    # Usernames to act on.
    usernames: []

    project_tag: ""
    tenant_id: ""

  tasks:

    - name: Fail when no usernames provided
      ansible.builtin.fail:
        msg: "Set usernames to a non-empty list, e.g. -e '{\"usernames\":[\"user1\"]}'"
      when: usernames | length == 0

    - name: "Set access state for user: {{ item }}"
      lantronix.oob.percepxion_users:
        username: "{{ item }}"
        state: "{{ 'suspended' if lockdown_action == 'suspend' else 'enabled' }}"
        project_tag: "{{ project_tag | default(omit) }}"
        tenant_id: "{{ tenant_id | default(omit) }}"
      loop: "{{ usernames }}"
      register: lockdown_result

    - name: Show what changed
      ansible.builtin.debug:
        msg: >-
          {{ lockdown_result.results
             | map(attribute='username') | list
             if lockdown_result.results is defined else [] }}
